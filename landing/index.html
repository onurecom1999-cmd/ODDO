<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODDO – One Day or Day One</title>
  <meta name="description" content="Der 12-Wochen-Pakt mit deiner Crew. Schaffst du 80 %, ist der nächste Pakt gratis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --surface: #151517;
      --border: #26262a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #c6ff3d;
      --accent-text: #0b0b0c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
    .logo { font-weight: 800; font-size: 22px; letter-spacing: 0.08em; }
    .lang { display: flex; gap: 4px; }
    .lang button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .lang button.active { color: var(--text); border-color: var(--text); }

    .hero { padding: 72px 0 56px; text-align: center; }
    .tagline { color: var(--accent); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; }
    h1 { font-size: clamp(36px, 7vw, 68px); font-weight: 800; line-height: 1.05; margin: 16px auto 20px; max-width: 820px; }
    .lead { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto 32px; }

    form { display: flex; gap: 8px; max-width: 460px; margin: 0 auto; flex-wrap: wrap; }
    input[type=email] {
      flex: 1 1 220px; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 14px 16px; border-radius: 12px; font: inherit;
    }
    .btn {
      background: var(--accent); color: var(--accent-text); border: none; font: inherit; font-weight: 600;
      padding: 14px 22px; border-radius: 12px; cursor: pointer;
      display: inline-block; text-decoration: none;
    }
    form .btn { flex: 1 1 140px; }
    .note { color: var(--muted); font-size: 13px; margin-top: 12px; }
    .thanks { color: var(--accent); font-weight: 600; margin-top: 12px; display: none; }

    section { padding: 56px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 30px; font-weight: 800; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .card .num { color: var(--accent); font-weight: 800; font-size: 28px; }
    .card h3 { font-size: 18px; margin: 8px 0 6px; }
    .card p { color: var(--muted); font-size: 15px; }

    .price { text-align: center; }
    .price .amount { font-size: 56px; font-weight: 800; }
    .price .amount small { font-size: 18px; color: var(--muted); font-weight: 400; }
    .price ul { list-style: none; color: var(--muted); margin: 20px auto 28px; max-width: 420px; }
    .price li { padding: 6px 0; }
    .price li::before { content: "✓ "; color: var(--accent); }

    footer { color: var(--muted); font-size: 13px; padding: 32px 0 48px; border-top: 1px solid var(--border); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">ODDO</div>
      <div class="lang" role="group" aria-label="Sprache">
        <button data-lang="de">DE</button>
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </div>
    </header>

    <div class="hero">
      <div class="tagline">One Day or Day One</div>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <form id="waitlist">
        <input type="email" name="email" required data-i18n-placeholder="email_placeholder">
        <button class="btn" type="submit" data-i18n="cta"></button>
      </form>
      <p class="note" data-i18n="cta_note"></p>
      <p class="thanks" id="thanks" data-i18n="thanks"></p>
    </div>

    <section>
      <h2 data-i18n="how_title"></h2>
      <div class="grid">
        <div class="card"><div class="num">01</div><h3 data-i18n="step1_title"></h3><p data-i18n="step1_text"></p></div>
        <div class="card"><div class="num">02</div><h3 data-i18n="step2_title"></h3><p data-i18n="step2_text"></p></div>
        <div class="card"><div class="num">03</div><h3 data-i18n="step3_title"></h3><p data-i18n="step3_text"></p></div>
        <div class="card"><div class="num">04</div><h3 data-i18n="step4_title"></h3><p data-i18n="step4_text"></p></div>
      </div>
    </section>

    <section class="price">
      <h2 data-i18n="price_title"></h2>
      <div class="amount"><span data-i18n="price_amount"></span> <small data-i18n="price_unit"></small></div>
      <ul>
        <li data-i18n="price_1"></li>
        <li data-i18n="price_2"></li>
        <li data-i18n="price_3"></li>
        <li data-i18n="price_4"></li>
      </ul>
      <a class="btn" href="#waitlist" data-i18n="cta"></a>
    </section>

    <footer>
      <p data-i18n="footer"></p>
    </footer>
  </div>

  <script>
    // Where sign-ups are sent (e.g. a Formspree or Google Form endpoint). Empty = only show the thank-you message.
    const WAITLIST_ENDPOINT = "";

    const texts = {
      de: {
        hero_title: "12 Wochen. Deine Crew. Kein Aufgeben.",
        hero_lead: "ODDO ist der Fitness-Pakt, den du mit 4 bis 6 Leuten durchziehst. Schaffst du 80 %, ist dein nächster Pakt gratis.",
        email_placeholder: "Deine E-Mail",
        cta: "Platz sichern",
        cta_note: "Erster Pakt startet am 26. Oktober. Begrenzte Plätze.",
        thanks: "Du bist dabei. Wir melden uns vor dem Start.",
        how_title: "So funktioniert's",
        step1_title: "Pakt starten",
        step1_text: "Wähle dein Ziel, Studio oder Zuhause. Du bekommst einen klaren 12-Wochen-Plan.",
        step2_title: "Crew finden",
        step2_text: "Du trainierst mit 4 bis 6 Leuten mit demselben Ziel. Ihr seht, wer heute trainiert hat.",
        step3_title: "Jeden Tag ein Button",
        step3_text: "„Heute“ zeigt dir genau, was dran ist. Abhaken mit einem Tap.",
        step4_title: "Durchziehen, gratis weiter",
        step4_text: "29 von 36 Einheiten geschafft? Dein nächster Pakt geht auf uns.",
        price_title: "Ein Pakt. Ein Preis.",
        price_amount: "69 €",
        price_unit: "für 12 Wochen",
        price_1: "Persönlicher 12-Wochen-Plan",
        price_2: "Deine Crew und wöchentlicher Live-Call",
        price_3: "Nächster Pakt gratis bei 80 %",
        price_4: "Kein Abo, keine Kündigungsfalle",
        footer: "© 2026 ODDO. One Day or Day One."
      },
      tr: {
        hero_title: "12 hafta. Ekibin. Pes etmek yok.",
        hero_lead: "ODDO, 4-6 kişiyle birlikte tamamladığın fitness paktı. %80'ini başarırsan bir sonraki pakt ücretsiz.",
        email_placeholder: "E-posta adresin",
        cta: "Yerini ayırt",
        cta_note: "İlk pakt 26 Ekim'de başlıyor. Sınırlı kontenjan.",
        thanks: "Listedesin. Başlamadan önce sana yazacağız.",
        how_title: "Nasıl çalışır",
        step1_title: "Paktı başlat",
        step1_text: "Hedefini seç, spor salonu ya da ev. Net bir 12 haftalık plan alırsın.",
        step2_title: "Ekibini bul",
        step2_text: "Aynı hedefe sahip 4-6 kişiyle antrenman yaparsın. Bugün kimin çalıştığını görürsünüz.",
        step3_title: "Her gün tek bir buton",
        step3_text: "\"Bugün\" sana tam olarak ne yapacağını gösterir. Tek dokunuşla işaretle.",
        step4_title: "Tamamla, ücretsiz devam et",
        step4_text: "36 antrenmandan 29'unu mu tamamladın? Bir sonraki pakt bizden.",
        price_title: "Bir pakt. Tek fiyat.",
        price_amount: "69 €",
        price_unit: "12 hafta için",
        price_1: "Kişisel 12 haftalık plan",
        price_2: "Ekibin ve haftalık canlı görüşme",
        price_3: "%80'de bir sonraki pakt ücretsiz",
        price_4: "Abonelik yok, iptal tuzağı yok",
        footer: "© 2026 ODDO. One Day or Day One."
      },
      en: {
        hero_title: "12 weeks. Your crew. No quitting.",
        hero_lead: "ODDO is the fitness pact you finish together with 4 to 6 people. Hit 80% and your next pact is free.",
        email_placeholder: "Your email",
        cta: "Save my spot",
        cta_note: "First pact starts October 26. Limited spots.",
        thanks: "You're in. We'll reach out before the start.",
        how_title: "How it works",
        step1_title: "Start your pact",
        step1_text: "Pick your goal, gym or home. You get a clear 12-week plan.",
        step2_title: "Join your crew",
        step2_text: "Train with 4 to 6 people who share your goal. See who trained today.",
        step3_title: "One button a day",
        step3_text: "\"Today\" shows exactly what's next. Check it off with one tap.",
        step4_title: "Finish, continue for free",
        step4_text: "Completed 29 of 36 sessions? Your next pact is on us.",
        price_title: "One pact. One price.",
        price_amount: "€69",
        price_unit: "for 12 weeks",
        price_1: "Personal 12-week plan",
        price_2: "Your crew and a weekly live call",
        price_3: "Next pact free at 80%",
        price_4: "No subscription, no cancellation trap",
        footer: "© 2026 ODDO. One Day or Day One."
      }
    };

    function setLang(lang) {
      const t = texts[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t[el.dataset.i18nPlaceholder]; });
      document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      try { localStorage.setItem("oddo-lang", lang); } catch (e) {}
    }

    function initialLang() {
      try {
        const saved = localStorage.getItem("oddo-lang");
        if (saved && texts[saved]) return saved;
      } catch (e) {}
      const browser = (navigator.language || "de").slice(0, 2);
      return texts[browser] ? browser : "en";
    }

    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
    setLang(initialLang());

    document.getElementById("waitlist").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;
      if (WAITLIST_ENDPOINT) {
        try {
          await fetch(WAITLIST_ENDPOINT, {
            method: "POST",
            headers: { "Accept": "application/json" },
            body: new FormData(form)
          });
        } catch (err) {}
      }
      form.style.display = "none";
      document.getElementById("thanks").style.display = "block";
    });
  </script>
</body>
</html>
