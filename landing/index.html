<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODDO – One Day or Day One</title>
  <meta name="description" content="Irgendwann ist kein Tag. 12 Wochen, deine Crew, ein Pakt. Schaffst du 80 %, ist der nächste Pakt gratis.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --border: #262626;
      --text: #f5f5f4;
      --muted: #a3a3a3;
      --dim: #525252;
      --accent: #d4ff3a;
      --accent-ink: #0a0a0a;
      --paper: #f3efe6;
      --paper-ink: #1a1a1a;
      --red: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .display { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.92; }
    .accent { color: var(--accent); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--accent); color: var(--accent-ink); border: none; cursor: pointer;
      font: inherit; font-weight: 800; font-size: 16px;
      padding: 18px 28px; border-radius: 999px;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 0 0 0 rgba(212,255,58,.5);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -10px rgba(212,255,58,.6); }
    .btn .arrow { transition: transform .15s ease; }
    .btn:hover .arrow { transform: translateX(4px); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { box-shadow: none; }

    /* Nav */
    nav { position: sticky; top: 0; z-index: 20; background: rgba(10,10,10,.8); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; }
    nav.scrolled { border-color: var(--border); }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
    .logo { font-family: Anton, Impact, sans-serif; font-size: 26px; letter-spacing: 0.06em; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .lang { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .lang button { background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
    .lang button.active { background: var(--text); color: var(--bg); }
    .nav-cta { padding: 10px 16px; font-size: 14px; }
    @media (max-width: 560px) { .nav-cta { display: none; } }

    /* Hero */
    .hero { position: relative; padding: 56px 0 72px; overflow: hidden; }
    .hero::before {
      content: ""; position: absolute; inset: -200px 0 auto 50%; width: 900px; height: 700px; transform: translateX(-30%);
      background: radial-gradient(closest-side, rgba(212,255,58,.14), transparent 70%); pointer-events: none;
    }
    .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: center; position: relative; }
    @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 56px; } }
    .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .flip { margin: 24px 0 24px; font-size: clamp(64px, 13vw, 150px); }
    .flip .line { display: block; position: relative; width: fit-content; }
    .flip .oneday { color: var(--dim); }
    .flip .oneday::after {
      content: ""; position: absolute; left: -2%; top: 52%; height: 0.09em; width: 0; background: var(--red);
      transform: rotate(-3deg); animation: strike .6s .7s cubic-bezier(.7,0,.3,1) forwards;
    }
    @keyframes strike { to { width: 104%; } }
    .flip .dayone { color: var(--accent); opacity: 0; transform: translateY(30px); animation: rise .7s 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .hero-lead { font-size: clamp(17px, 2.2vw, 21px); color: var(--muted); max-width: 540px; }
    .hero-lead strong { color: var(--text); font-weight: 600; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 32px; }

    .countdown { display: flex; gap: 10px; }
    .countdown div { text-align: center; }
    .countdown b { display: block; font-family: Anton, Impact, sans-serif; font-size: 28px; line-height: 1; font-weight: 400; min-width: 2ch; }
    .countdown span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .countdown-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    /* Phone mockup */
    .phone-wrap { position: relative; display: flex; justify-content: center; }
    .phone {
      width: 300px; border-radius: 44px; padding: 12px; background: #000; border: 1px solid #2a2a2a;
      box-shadow: 0 40px 120px -40px rgba(212,255,58,.35), inset 0 0 0 2px #111;
      transform: rotate(3deg);
    }
    .screen { background: #0f0f0f; border-radius: 34px; padding: 22px 18px; min-height: 560px; display: flex; flex-direction: column; gap: 16px; }
    .scr-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .scr-day { font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; }
    .ring-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 14px; }
    .ring { width: 74px; height: 74px; flex: none; }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .track { stroke: #262626; }
    .ring .prog { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 201; stroke-dashoffset: 201; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1.6s 1.6s cubic-bezier(.2,.8,.2,1); }
    .ring text { fill: var(--text); font-family: Anton, Impact, sans-serif; font-size: 20px; }
    .ring-row p { font-size: 13px; color: var(--muted); }
    .ring-row p b { color: var(--text); display: block; font-size: 15px; }
    .crew-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .crew { display: flex; gap: 8px; }
    .av { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--accent-ink); }
    .av .ok { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #0f0f0f; font-size: 10px; display: grid; place-items: center; color: var(--accent-ink); }
    .av.me { background: var(--surface-2); color: var(--text); border: 2px dashed var(--accent); }
    .today {
      margin-top: auto; background: var(--accent); color: var(--accent-ink); border-radius: 24px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .today small { display: block; font-size: 12px; font-weight: 600; opacity: .7; }
    .today b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 24px; display: block; line-height: 1; }
    .today .go { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; font-size: 22px; }
    .toast {
      position: absolute; left: -10px; top: 70px; background: rgba(28,28,28,.92); backdrop-filter: blur(8px); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; max-width: 240px;
      box-shadow: 0 20px 40px -20px #000; z-index: 2; opacity: 0; transform: translateY(10px); animation: rise .6s 2.6s forwards;
    }
    .toast .av { width: 32px; height: 32px; font-size: 12px; }
    @media (max-width: 900px) { .toast { left: 0; } }

    /* Sections */
    section { padding: 96px 0; }
    .eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; }
    h2.display { font-size: clamp(44px, 7.5vw, 92px); }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    /* Pain */
    .pain { border-top: 1px solid var(--border); }
    .quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
    @media (max-width: 760px) { .quotes { grid-template-columns: 1fr; } }
    .quote { border: 1px solid var(--border); border-radius: 20px; padding: 26px; background: var(--surface); position: relative; overflow: hidden; }
    .quote p { font-size: 20px; font-weight: 600; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
    .quote small { display: block; margin-top: 12px; color: var(--dim); font-size: 13px; }
    .verdict { margin-top: 48px; font-size: clamp(22px, 3vw, 32px); font-weight: 800; max-width: 760px; line-height: 1.25; }

    /* Pillars */
    .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
    @media (max-width: 860px) { .pillars { grid-template-columns: 1fr; } }
    .pillar { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 32px; min-height: 280px; display: flex; flex-direction: column; }
    .pillar .n { font-family: Anton, Impact, sans-serif; font-size: 72px; line-height: 1; color: var(--accent); }
    .pillar h3 { font-size: 26px; margin: 16px 0 10px; font-weight: 800; }
    .pillar p { color: var(--muted); }
    .pillar.hl { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .pillar.hl .n { color: var(--accent-ink); }
    .pillar.hl p { color: rgba(10,10,10,.75); }

    /* Timeline */
    .timeline { margin-top: 56px; }
    .weeks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
    .wk { height: 64px; border-radius: 10px; background: var(--surface-2); position: relative; overflow: hidden; }
    .wk::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleY(0); transform-origin: bottom; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
    .timeline.in .wk::after { transform: scaleY(1); }
    .wk span { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); z-index: 1; transition: color .3s .3s; }
    .timeline.in .wk span { color: var(--accent-ink); }
    .milestones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
    @media (max-width: 760px) { .milestones { grid-template-columns: 1fr 1fr; } .wk { height: 44px; } .wk span { font-size: 9px; } }
    .ms b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; }
    .ms small { color: var(--muted); font-size: 14px; }

    /* Pact */
    .pact-section { background: linear-gradient(180deg, var(--bg), #11140a 50%, var(--bg)); }
    .pact-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 56px; align-items: center; }
    @media (max-width: 900px) { .pact-grid { grid-template-columns: 1fr; } }
    .paper {
      position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 40px 36px 36px;
      box-shadow: 0 50px 100px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.05);
      transform: rotate(-1.2deg);
      background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.05) 31px 32px);
    }
    .paper h3 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
    .paper h3 small { font-family: Inter, sans-serif; font-size: 12px; letter-spacing: 0; color: #777; text-transform: none; font-weight: 600; }
    .paper .terms { margin: 22px 0 26px; font-size: 17px; line-height: 1.75; }
    .paper .terms .name-out { font-family: Caveat, cursive; font-size: 28px; color: #1d3fb8; border-bottom: 1.5px solid #999; padding: 0 6px; min-width: 120px; display: inline-block; line-height: 1.1; }
    .paper label { display: block; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
    .paper input {
      width: 100%; background: transparent; border: none; border-bottom: 1.5px solid #bbb; padding: 8px 2px; font: inherit; font-size: 17px; color: var(--paper-ink); outline: none;
    }
    .paper input:focus { border-color: var(--paper-ink); }
    .paper input.sig { font-family: Caveat, cursive; font-size: 32px; color: #1d3fb8; }
    .paper .btn { width: 100%; margin-top: 26px; background: var(--paper-ink); color: var(--paper); }
    .paper .btn:hover { box-shadow: 0 10px 30px -10px rgba(0,0,0,.6); }
    .paper .fine { font-size: 12px; color: #777; margin-top: 12px; text-align: center; }
    .stamp {
      position: absolute; right: 28px; bottom: 22px; border: 4px solid #d6322b; color: #d6322b; border-radius: 10px; padding: 8px 14px;
      font-family: Anton, Impact, sans-serif; font-size: 30px; text-transform: uppercase; letter-spacing: .06em; line-height: 1; text-align: center;
      transform: rotate(-14deg) scale(2.4); opacity: 0; pointer-events: none; mix-blend-mode: multiply;
    }
    .stamp small { display: block; font-size: 13px; letter-spacing: .12em; }
    .paper.signed .stamp { animation: stamp .45s cubic-bezier(.3,1.6,.6,1) forwards; }
    @keyframes stamp { to { opacity: .9; transform: rotate(-14deg) scale(1); } }
    .welcome { display: none; margin-top: 18px; font-weight: 600; text-align: center; }
    .paper.signed .welcome { display: block; }
    .paper.signed form { display: none; }
    .paper.signed { padding-bottom: 120px; }
    .paper.signed .welcome { text-align: left; max-width: 60%; }

    /* Price */
    .price-box { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 28px; overflow: hidden; }
    @media (max-width: 760px) { .price-box { grid-template-columns: 1fr; } }
    .price-box > div { padding: 36px; }
    .price-box .them { background: var(--surface); color: var(--muted); }
    .price-box .us { background: var(--surface-2); }
    .price-box .big { font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 11vw, 72px); white-space: nowrap; line-height: 1; margin: 10px 0; }
    .price-box .them .big { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; }
    .price-box ul { list-style: none; margin-top: 18px; }
    .price-box li { padding: 7px 0; border-top: 1px solid var(--border); font-size: 15px; }
    .price-box .us li::before { content: "✓  "; color: var(--accent); font-weight: 800; }
    .price-box .them li::before { content: "✕  "; color: var(--red); font-weight: 800; }

    /* FAQ */
    details { border-top: 1px solid var(--border); padding: 22px 0; }
    details:last-child { border-bottom: 1px solid var(--border); }
    summary { cursor: pointer; font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
    summary::after { content: "+"; color: var(--accent); font-size: 24px; line-height: 1; transition: transform .2s; }
    details[open] summary::after { transform: rotate(45deg); }
    details p { color: var(--muted); margin-top: 12px; max-width: 720px; }

    /* Final */
    .final { text-align: center; padding: 120px 0 100px; }
    .final h2 { font-size: clamp(56px, 11vw, 140px); }
    .choice { display: flex; justify-content: center; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
    .shake { animation: shake .45s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .nope { min-height: 24px; margin-top: 18px; color: var(--red); font-weight: 600; }

    footer { border-top: 1px solid var(--border); padding: 32px 0 48px; color: var(--dim); font-size: 13px; }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="wrap">
      <a href="#" class="logo">ODDO</a>
      <div class="nav-right">
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="de">DE</button>
          <button data-lang="tr">TR</button>
          <button data-lang="en">EN</button>
        </div>
        <a href="#pact" class="btn nav-cta" data-i18n="nav_cta"></a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="pill"><span class="dot"></span><span data-i18n="pill"></span></div>
        <h1 class="flip display" aria-label="One day or Day One">
          <span class="line oneday">One day</span>
          <span class="line dayone">Day One.</span>
        </h1>
        <p class="hero-lead" data-i18n-html="hero_lead"></p>
        <div class="hero-actions">
          <a href="#pact" class="btn"><span data-i18n="hero_cta"></span><span class="arrow">→</span></a>
          <div>
            <div class="countdown-label" data-i18n="countdown_label"></div>
            <div class="countdown" id="countdown">
              <div><b data-cd="d">00</b><span data-i18n="cd_d"></span></div>
              <div><b data-cd="h">00</b><span data-i18n="cd_h"></span></div>
              <div><b data-cd="m">00</b><span data-i18n="cd_m"></span></div>
              <div><b data-cd="s">00</b><span data-i18n="cd_s"></span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="phone-wrap" aria-hidden="true">
        <div class="toast"><div class="av" style="background:#ff9f43">L</div><span data-i18n="toast"></span></div>
        <div class="phone">
          <div class="screen">
            <div class="scr-top"><span>ODDO</span><span data-i18n="scr_week"></span></div>
            <div class="scr-day" data-i18n="scr_day"></div>
            <div class="ring-row">
              <svg class="ring" viewBox="0 0 74 74">
                <circle class="track" cx="37" cy="37" r="32"/>
                <circle class="prog" id="ring" cx="37" cy="37" r="32"/>
                <text x="37" y="44" text-anchor="middle">14/36</text>
              </svg>
              <p><b data-i18n="scr_ring_title"></b><span data-i18n="scr_ring_text"></span></p>
            </div>
            <div class="crew-title" data-i18n="scr_crew"></div>
            <div class="crew">
              <div class="av" style="background:#ff9f43">L<span class="ok">✓</span></div>
              <div class="av" style="background:#54a0ff">M<span class="ok">✓</span></div>
              <div class="av" style="background:#ff6b9d">A</div>
              <div class="av" style="background:#1dd1a1">J<span class="ok">✓</span></div>
              <div class="av me" data-i18n="scr_me"></div>
            </div>
            <div class="today">
              <div><small data-i18n="scr_today"></small><b data-i18n="scr_workout"></b><small data-i18n="scr_time"></small></div>
              <div class="go">→</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="pain">
    <div class="wrap">
      <div class="eyebrow reveal" data-i18n="pain_eyebrow"></div>
      <h2 class="display reveal" data-i18n-html="pain_title"></h2>
      <div class="quotes">
        <div class="quote reveal"><p data-i18n="q1"></p><small data-i18n="q1s"></small></div>
        <div class="quote reveal"><p data-i18n="q2"></p><small data-i18n="q2s"></small></div>
        <div class="quote reveal"><p data-i18n="q3"></p><small data-i18n="q3s"></small></div>
      </div>
      <p class="verdict reveal" data-i18n-html="verdict"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="eyebrow reveal" data-i18n="how_eyebrow"></div>
      <h2 class="display reveal" data-i18n-html="how_title"></h2>
      <div class="pillars">
        <div class="pillar reveal"><div class="n">01</div><h3 data-i18n="p1t"></h3><p data-i18n="p1"></p></div>
        <div class="pillar reveal"><div class="n">02</div><h3 data-i18n="p2t"></h3><p data-i18n="p2"></p></div>
        <div class="pillar hl reveal"><div class="n">03</div><h3 data-i18n="p3t"></h3><p data-i18n="p3"></p></div>
      </div>

      <div class="timeline reveal" id="timeline">
        <div class="weeks"></div>
        <div class="milestones">
          <div class="ms"><b data-i18n="m1t"></b><small data-i18n="m1"></small></div>
          <div class="ms"><b data-i18n="m2t"></b><small data-i18n="m2"></small></div>
          <div class="ms"><b data-i18n="m3t"></b><small data-i18n="m3"></small></div>

    let lang = "de";

    function setLang(next) {
      lang = next;
      const t = texts[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      syncName();
      try { localStorage.setItem("oddo-lang", lang); } catch (e) {}
    }

    function initialLang() {
      try {
        const saved = localStorage.getItem("oddo-lang");
        if (saved && texts[saved]) return saved;
      } catch (e) {}
      const browser = (navigator.language || "de").slice(0, 2);
      return texts[browser] ? browser : "en";
    }

    // The signature typed into the form appears live inside the pact text.
    const sig = document.getElementById("sig");
    function syncName() {
      const out = document.getElementById("name-out");
      if (out) out.textContent = sig.value.trim() || " ";
    }
    sig.addEventListener("input", syncName);

    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
    setLang(initialLang());

    // Countdown to the first pact.
    function tick() {
      const diff = Math.max(0, PACT_START - Date.now());
      const parts = {
        d: Math.floor(diff / 864e5),
        h: Math.floor(diff / 36e5) % 24,
        m: Math.floor(diff / 6e4) % 60,
        s: Math.floor(diff / 1e3) % 60
      };
      for (const k in parts) document.querySelector(`[data-cd="${k}"]`).textContent = String(parts[k]).padStart(2, "0");
    }
    tick();
    setInterval(tick, 1000);

    // 12 week blocks for the timeline.
    const weeks = document.querySelector(".weeks");
    for (let i = 1; i <= 12; i++) {
      const w = document.createElement("div");
      w.className = "wk";
      w.innerHTML = `<span style="transition-delay:${(0.3 + (i - 1) * 0.08).toFixed(2)}s">W${i}</span>`;
      weeks.appendChild(w);
    }
    // Pseudo-elements can't take inline styles, so stagger the fill with generated rules.
    const wkStyle = document.createElement("style");
    wkStyle.textContent = Array.from({ length: 12 }, (_, i) => `.wk:nth-child(${i + 1})::after{transition-delay:${(i * 0.08).toFixed(2)}s}`).join("");
    document.head.appendChild(wkStyle);

    // Scroll reveal.
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));

    // Progress ring fills on load: 14 of 36 sessions.
    requestAnimationFrame(() => { document.getElementById("ring").style.strokeDashoffset = 201 * (1 - 14 / 36); });

    // Nav border once scrolled.
    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 10), { passive: true });

    // Signing the pact.
    document.getElementById("pact-form").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;
      if (WAITLIST_ENDPOINT) {
        const data = new FormData(form);
        data.append("language", lang);
        try {
          await fetch(WAITLIST_ENDPOINT, { method: "POST", headers: { "Accept": "application/json" }, body: data });
        } catch (err) {}
      }
      document.getElementById("paper").classList.add("signed");
    });

    // The "One day" button refuses.
    let nopeIndex = 0;
    const later = document.getElementById("later");
    later.addEventListener("click", () => {
      later.classList.remove("shake");
      void later.offsetWidth;
      later.classList.add("shake");
      const nopes = texts[lang].nopes;
      document.getElementById("nope").textContent = nopes[nopeIndex % nopes.length];
      nopeIndex++;
    });
