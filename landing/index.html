<!doctype html>
<html lang="de" data-page-lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODDO – One Day or Day One</title>
  <meta name="description" content="Training, Ernährung per Foto, Lauf und Rad, Fortschritt: alles in einer App, ganz auf dich zugeschnitten. Ab jetzt keine Ausreden mehr.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="canonical" href="https://oddo-app.netlify.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ODDO">
  <meta property="og:url" content="https://oddo-app.netlify.app/">
  <meta property="og:title" content="ODDO – Ab jetzt gibt es keine Ausreden mehr">
  <meta property="og:description" content="Persönlicher Trainingsplan, Kalorien per Foto, Lauf und Rad, Fortschritt: alles in einer App. Trag dich jetzt für den Gründerzugang ein.">
  <meta property="og:image" content="https://oddo-app.netlify.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://oddo-app.netlify.app/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --border: #262626;
      --text: #f5f5f4;
      --muted: #a3a3a3;
      --dim: #525252;
      --accent: #d4ff3a;
      --accent-ink: #0a0a0a;
      --paper: #f3efe6;
      --paper-ink: #1a1a1a;
      --red: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .display { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.92; }
    .accent { color: var(--accent); }
    /* Turkish capitals carry dots and cedillas (İ, Ş, Ç, Ğ) that collide at the tight display line height. */
    html[lang="tr"] .display { line-height: 1.04; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--accent); color: var(--accent-ink); border: none; cursor: pointer;
      font: inherit; font-weight: 800; font-size: 16px;
      padding: 18px 28px; border-radius: 999px;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 0 0 0 rgba(212,255,58,.5);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -10px rgba(212,255,58,.6); }
    .btn .arrow { transition: transform .15s ease; }
    .btn:hover .arrow { transform: translateX(4px); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { box-shadow: none; }

    /* Nav */
    nav { position: sticky; top: 0; z-index: 20; background: rgba(10,10,10,.8); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; }
    nav.scrolled { border-color: var(--border); }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
    .logo { font-family: Anton, Impact, sans-serif; font-size: 26px; letter-spacing: 0.06em; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .lang { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .lang button { background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
    .lang button.active { background: var(--text); color: var(--bg); }
    .nav-cta { padding: 10px 16px; font-size: 14px; }
    @media (max-width: 560px) { .nav-cta { display: none; } }

    /* Hero */
    .hero { position: relative; padding: 56px 0 72px; overflow: hidden; }
    .hero::before {
      content: ""; position: absolute; inset: -200px 0 auto 50%; width: 900px; height: 700px; transform: translateX(-30%);
      background: radial-gradient(closest-side, rgba(212,255,58,.14), transparent 70%); pointer-events: none;
    }
    .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: center; position: relative; }
    @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 56px; } }
    .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .flip { margin: 24px 0 24px; font-size: clamp(64px, 13vw, 150px); }
    .flip .line { display: block; position: relative; width: fit-content; }
    .flip .oneday { color: var(--dim); }
    .flip .oneday::after {
      content: ""; position: absolute; left: -2%; top: 52%; height: 0.09em; width: 0; background: var(--red);
      transform: rotate(-3deg); animation: strike .6s .7s cubic-bezier(.7,0,.3,1) forwards;
    }
    @keyframes strike { to { width: 104%; } }
    .flip .dayone { color: var(--accent); opacity: 0; transform: translateY(30px); animation: rise .7s 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .hero-lead { font-size: clamp(17px, 2.2vw, 21px); color: var(--muted); max-width: 540px; }
    .hero-lead strong { color: var(--text); font-weight: 600; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 32px; }

    /* Phone mockup */
    .phone-wrap { position: relative; display: flex; justify-content: center; }
    .phone {
      width: 300px; border-radius: 44px; padding: 12px; background: #000; border: 1px solid #2a2a2a;
      box-shadow: 0 40px 120px -40px rgba(212,255,58,.35), inset 0 0 0 2px #111;
      transform: rotate(3deg);
    }
    .screen { background: #0f0f0f; border-radius: 34px; padding: 22px 18px; min-height: 560px; display: flex; flex-direction: column; gap: 16px; }
    .scr-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .scr-day { font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; }
    .today {
      margin-top: auto; background: var(--accent); color: var(--accent-ink); border-radius: 24px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .today small { display: block; font-size: 12px; font-weight: 600; opacity: .7; }
    .today b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 24px; display: block; line-height: 1; }
    .today .go { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; font-size: 22px; }
    .toast {
      position: absolute; left: -10px; top: 46%; background: rgba(28,28,28,.92); backdrop-filter: blur(8px); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; max-width: 240px;
      box-shadow: 0 20px 40px -20px #000; z-index: 2; opacity: 0; transform: translateY(10px); animation: rise .6s 2.6s forwards;
    }
    @media (max-width: 900px) { .toast { left: 0; } }


    .hero-sub { font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.2; margin-bottom: 12px; text-wrap: balance; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 32px; }
    html { overflow-x: clip; }
    .hero-note { font-size: 13px; color: var(--dim); }
    /* Day One Challenge strip above the hero headline; hidden once sign-up is over. */
    .ch { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: 20px; padding: 14px 18px; margin-bottom: 28px; max-width: 560px; color: inherit; text-decoration: none; }
    .ch:hover { background: var(--surface-2); }
    .ch .n { font-family: Anton, Impact, sans-serif; font-size: 40px; line-height: 1; color: var(--accent); min-width: 54px; text-align: center; }
    .ch .n i { display: block; font-family: Inter, sans-serif; font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
    .ch small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
    .ch b { display: block; font-size: 16px; font-weight: 800; line-height: 1.3; }
    .ch .go { margin-left: auto; font-size: 22px; color: var(--accent); }
    .ch[hidden] { display: none; }
    /* Shown from launch day on (APP_LIVE in the script). */
    .app-only { display: none !important; }
    body.app-live .app-only { display: inline-flex !important; }
    body.app-live p.app-only { display: block !important; }
    body.app-live .hide-live { display: none !important; }
    /* App Store, Google Play and the web app. "Bald" until the links in STORES are filled in. */
    .get { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .store { position: relative; display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; border: 1px solid #3a3a3a; border-radius: 12px; padding: 9px 18px 9px 12px; min-width: 160px; transition: transform .15s ease, border-color .15s ease; }
    .store:hover { transform: translateY(-2px); border-color: var(--accent); }
    .store svg { width: 26px; height: 26px; flex: none; }
    .store small { display: block; font-size: 11px; line-height: 1.15; color: #cfcfcf; }
    .store b { display: block; font-size: 18px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; }
    .store .soon { position: absolute; top: -9px; right: -7px; background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; transform: rotate(4deg); }
    .store.web { background: var(--surface); }
    .store.mine { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,255,58,.14); }
    .store.live .soon { display: none; }
    .get-note { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 21px; max-width: 520px; }
    .get-note.pop { color: var(--accent); font-weight: 600; }
    @media (max-width: 520px) { .store { flex: 1 1 140px; min-width: 0; padding-right: 10px; } }
    .final .get { justify-content: center; margin-top: 56px; }
    .final .get-note { margin: 12px auto 0; }
    .get-title { margin-top: 72px; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    footer .legal { display: flex; gap: 18px; flex-wrap: wrap; }
    footer .legal a { color: var(--dim); }
    footer .topics { display: flex; gap: 18px; flex-wrap: wrap; }
    footer .topics a { color: var(--muted); }

    /* Phone screen */
    .scr-budget { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; }
    .scr-budget small { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--accent); }
    .scr-budget b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1.05; }
    .scr-bar { height: 7px; background: var(--surface-2); border-radius: 7px; overflow: hidden; margin-top: 8px; }
    .scr-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1.4s 1.4s cubic-bezier(.2,.8,.2,1); }
    .scr-bar.go i { width: 58%; }
    .scr-list { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; }
    .scr-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; }
    .scr-item:first-child { border-top: 0; }
    .scr-item .bx { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--dim); flex: none; display: grid; place-items: center; font-size: 11px; color: var(--accent-ink); font-weight: 900; }
    .scr-item.ok .bx { background: var(--accent); border-color: var(--accent); }
    .scr-item.ok span { color: var(--muted); }
    .scr-item small { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 11px; white-space: nowrap; }
    .toast .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: Anton, Impact, sans-serif; font-size: 15px; flex: none; }

    /* Features */
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
    @media (max-width: 900px) { .features { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .features { grid-template-columns: 1fr; } }
    .feat { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 10px; }
    .feat .tag { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .feat h3 { font-size: 23px; font-weight: 800; line-height: 1.2; }
    .feat p { color: var(--muted); }
    .feat.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .feat.hl .tag { color: var(--accent-ink); }
    .feat.hl p { color: rgba(10,10,10,.75); }

    /* Steps */
    .earn { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 48px; }
    @media (max-width: 760px) { .earn { grid-template-columns: 1fr; } }
    .earn .feat .num { font-family: Anton, Impact, sans-serif; font-size: 56px; line-height: 1; letter-spacing: .01em; color: var(--accent); }
    .earn .feat.hl .num { color: var(--accent-ink); }
    .earn .feat ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
    .earn .feat ul li::before { content: "✓ "; color: var(--accent); font-weight: 900; }
    .earn .feat.hl ul { color: rgba(10,10,10,.75); }
    .earn .feat.hl ul li::before { color: var(--accent-ink); }
    .earn-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 28px; }
    .nav-link { color: var(--muted); font-weight: 700; font-size: 14px; text-decoration: none; }
    .nav-link:hover { color: var(--text); }
    @media (max-width: 560px) { .nav-link { display: none; } }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; counter-reset: s; }
    @media (max-width: 860px) { .steps { grid-template-columns: 1fr; } }
    .step { border-top: 2px solid var(--accent); padding-top: 20px; }
    .step .n { font-family: Anton, Impact, sans-serif; font-size: 64px; line-height: 1; color: var(--accent); }
    .step h3 { font-size: 24px; font-weight: 800; margin: 10px 0 8px; }
    .step p { color: var(--muted); }

    /* Before / after */
    .vs { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 28px; overflow: hidden; }
    @media (max-width: 760px) { .vs { grid-template-columns: 1fr; } }
    .vs > div { padding: 36px; }
    .vs .them { background: var(--surface); color: var(--muted); }
    .vs .us { background: var(--surface-2); }
    .vs .big { font-family: Anton, Impact, sans-serif; font-size: clamp(40px, 9vw, 64px); line-height: 1; margin: 10px 0; }
    .vs .them .big { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; }
    .vs ul { list-style: none; margin-top: 18px; }
    .vs li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 15px; }
    .vs .us li::before { content: "✓  "; color: var(--accent); font-weight: 800; }
    .vs .them li::before { content: "✕  "; color: var(--red); font-weight: 800; }

    /* Sections */
    section { padding: 96px 0; }
    .eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; }
    h2.display { font-size: clamp(44px, 7.5vw, 92px); }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    /* Pain */
    .pain { border-top: 1px solid var(--border); }
    .quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
    @media (max-width: 760px) { .quotes { grid-template-columns: 1fr; } }
    .quote { border: 1px solid var(--border); border-radius: 20px; padding: 26px; background: var(--surface); position: relative; overflow: hidden; }
    .quote p { font-size: 20px; font-weight: 600; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
    .quote small { display: block; margin-top: 12px; color: var(--dim); font-size: 13px; }
    .verdict { margin-top: 48px; font-size: clamp(22px, 3vw, 32px); font-weight: 800; max-width: 760px; line-height: 1.25; }

    /* Pact */
    .pact-section { background: linear-gradient(180deg, var(--bg), #11140a 50%, var(--bg)); }
    .pact-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 56px; align-items: center; }
    @media (max-width: 900px) { .pact-grid { grid-template-columns: 1fr; } }
    .paper {
      position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 40px 36px 36px;
      box-shadow: 0 50px 100px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.05);
      transform: rotate(-1.2deg);
      background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.05) 31px 32px);
    }
    .paper h3 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
    .paper h3 small { font-family: Inter, sans-serif; font-size: 12px; letter-spacing: 0; color: #777; text-transform: none; font-weight: 600; }
    .paper .terms { margin: 22px 0 26px; font-size: 17px; line-height: 1.75; }
    .paper .terms .name-out { font-family: Caveat, cursive; font-size: 28px; color: #1d3fb8; border-bottom: 1.5px solid #999; padding: 0 6px; min-width: 120px; display: inline-block; line-height: 1.1; }
    .paper label { display: block; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
    .paper input {
      width: 100%; background: transparent; border: none; border-bottom: 1.5px solid #bbb; padding: 8px 2px; font: inherit; font-size: 17px; color: var(--paper-ink); outline: none;
    }
    .paper input:focus { border-color: var(--paper-ink); }
    .paper input.sig { font-family: Caveat, cursive; font-size: 32px; color: #1d3fb8; }
    .paper .btn { width: 100%; margin-top: 26px; background: var(--paper-ink); color: var(--paper); }
    .paper .btn:hover { box-shadow: 0 10px 30px -10px rgba(0,0,0,.6); }
    .paper .fine { font-size: 12px; color: #777; margin-top: 12px; text-align: center; }
    .stamp {
      position: absolute; right: 28px; bottom: 22px; border: 4px solid #d6322b; color: #d6322b; border-radius: 10px; padding: 8px 14px;
      font-family: Anton, Impact, sans-serif; font-size: 30px; text-transform: uppercase; letter-spacing: .06em; line-height: 1; text-align: center;
      transform: rotate(-14deg) scale(2.4); opacity: 0; pointer-events: none; mix-blend-mode: multiply;
    }
    .stamp small { display: block; font-size: 13px; letter-spacing: .12em; }
    .paper.signed .stamp { animation: stamp .45s cubic-bezier(.3,1.6,.6,1) forwards; }
    @keyframes stamp { to { opacity: .9; transform: rotate(-14deg) scale(1); } }
    .paper form { transition: opacity .3s; }
    .paper.signed form { opacity: .35; pointer-events: none; }
    .paper.signed { animation: thud .35s .3s; }
    @keyframes thud { 30% { transform: rotate(-1.2deg) translateY(6px) scale(.985); } 60% { transform: rotate(-1.6deg) translateY(-2px); } }
    .paper.away { transition: transform .55s cubic-bezier(.6,0,.8,.4), opacity .45s; transform: rotate(-9deg) translateY(-40px) scale(.86); opacity: 0; }

    /* After signing: the founder pass, next steps and sharing. */
    .pact-section.signed .pact-copy, .pact-section.signed .paper { display: none; }
    .after[hidden], .pass[hidden] { display: none; }
    .after .display { font-size: clamp(48px, 7vw, 84px); overflow-wrap: break-word; }
    .after.in > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .after.in > *:nth-child(2) { animation-delay: .08s; } .after.in > *:nth-child(3) { animation-delay: .16s; }
    .after.in > *:nth-child(4) { animation-delay: .24s; } .after.in > *:nth-child(n+5) { animation-delay: .32s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    .next { list-style: none; margin: 28px 0 26px; display: grid; gap: 10px; max-width: 540px; }
    .next li { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: baseline; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .next li[hidden] { display: none; }
    .next b { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .next span { color: var(--text); font-weight: 500; }
    @media (max-width: 420px) { .next li { grid-template-columns: 1fr; gap: 4px; } }
    .after-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .after-actions .btn { padding: 15px 22px; font-size: 15px; }
    .redo { margin-top: 18px; background: none; border: none; color: var(--dim); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
    .pass {
      position: relative; overflow: hidden; border-radius: 26px; padding: 30px 30px 26px; color: var(--text); max-width: 460px; width: 100%; justify-self: center;
      background: radial-gradient(120% 90% at 100% 0%, rgba(212,255,58,.28), transparent 55%), linear-gradient(160deg, #1d1f17, #0d0d0d 60%);
      border: 1px solid rgba(212,255,58,.45); box-shadow: 0 40px 90px -40px rgba(212,255,58,.45), 0 30px 60px -30px #000;
    }
    .pass.in { animation: pass-in .9s cubic-bezier(.2,1.25,.4,1) both; }
    @keyframes pass-in { from { opacity: 0; transform: perspective(900px) translateY(70px) rotateX(38deg) scale(.86); } }
    .pass-shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); transform: translateX(-120%); pointer-events: none; }
    .pass.in .pass-shine { animation: shine 1.3s .6s ease-out; }
    @keyframes shine { to { transform: translateX(120%); } }
    .pass-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .pass-top .logo { font-size: 24px; }
    .pass-kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 5px 10px; border-radius: 999px; }
    .pass-sig { font-family: Caveat, cursive; font-size: clamp(54px, 13vw, 76px); line-height: 1; margin: 34px 0 6px; color: #fff; overflow-wrap: break-word; }
    .pass-line { color: var(--muted); font-weight: 500; }
    .pass-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; padding-top: 18px; border-top: 1px dashed rgba(255,255,255,.18); }
    .pass-rows small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .pass-rows b { display: block; font-size: 16px; font-weight: 800; margin-top: 4px; }
    .pass-ch { margin-top: 18px; display: flex; align-items: center; gap: 12px; background: rgba(212,255,58,.1); border-radius: 14px; padding: 12px 14px; }
    .pass-ch[hidden] { display: none; }
    .pass-ch .n { font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; color: var(--accent); min-width: 44px; text-align: center; }
    .pass-ch span { font-size: 14px; font-weight: 600; line-height: 1.3; }
    @media (max-width: 900px) { .pact-section.signed .pass { order: -1; } }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

    /* FAQ */
    details { border-top: 1px solid var(--border); padding: 22px 0; }
    details:last-child { border-bottom: 1px solid var(--border); }
    summary { cursor: pointer; font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
    summary::after { content: "+"; color: var(--accent); font-size: 24px; line-height: 1; transition: transform .2s; }
    details[open] summary::after { transform: rotate(45deg); }
    details p { color: var(--muted); margin-top: 12px; max-width: 720px; }

    /* Final */
    .final { text-align: center; padding: 120px 0 100px; }
    .final h2 { font-size: clamp(56px, 11vw, 140px); }
    .choice { display: flex; justify-content: center; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
    .shake { animation: shake .45s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .nope { min-height: 24px; margin-top: 18px; color: var(--red); font-weight: 600; }

    footer { border-top: 1px solid var(--border); padding: 32px 0 48px; color: var(--dim); font-size: 13px; }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

    function storeUrl(kind) { return kind === "web" ? (APP_LIVE ? APP_URL : "") : STORES[kind]; }
    function showStores() {
      const t = texts[lang];
      document.querySelectorAll("[data-store]").forEach(a => {
        const kind = a.dataset.store, url = storeUrl(kind);
        a.classList.toggle("live", !!url);
        a.classList.toggle("mine", kind === PLATFORM);
        a.href = url || "#pact";
        if (url && kind !== "web") { a.target = "_blank"; a.rel = "noopener"; }
        a.querySelector("small").textContent = t[`st_${kind}${url ? "_live" : ""}`];
      });
      const noneYet = !STORES.ios && !STORES.android;
      document.querySelectorAll("[data-get-note]").forEach(p => {
        p.classList.remove("pop");
        p.textContent = noneYet ? (signed() ? t.get_signed : t.get_note) : "";
      });
    }
    document.querySelectorAll("[data-store]").forEach(a => a.addEventListener("click", e => {
      if (storeUrl(a.dataset.store)) return;
      e.preventDefault();
      const t = texts[lang], note = a.closest("[data-stores]").nextElementSibling;
      note.textContent = signed() ? t.get_signed : t.get_soon;
      note.classList.add("pop");
      if (!signed()) setTimeout(() => {
        document.getElementById("pact").scrollIntoView({ behavior: "smooth" });
        setTimeout(() => sig.focus({ preventScroll: true }), 700);
      }, 900);
    }));

    function setLang(next) {
      lang = next;
      const t = texts[lang];
      document.documentElement.lang = lang;
      document.title = t.seo_title;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      document.querySelectorAll("[data-legal]").forEach(a => { a.href = `/${a.dataset.legal}.html#${lang}`; });
      syncName();
      showChallenge();
      showPassChallenge();
      showStores();
      showSigned();
      try { localStorage.setItem("oddo-lang", lang); } catch (e) {}
    }

    function initialLang() {
      if (PAGE_LANG !== "de") return PAGE_LANG;
      // Search engines read the German page as German.
      if (/bot|crawl|spider|lighthouse/i.test(navigator.userAgent)) return "de";
      try {
        const saved = localStorage.getItem("oddo-lang");
        if (saved && texts[saved]) return saved;
      } catch (e) {}
      const browser = (navigator.language || "de").slice(0, 2);
      return texts[browser] ? browser : "en";
    }

    // The signature typed into the form appears live inside the pledge text.
    const sig = document.getElementById("sig");
    function syncName() {
      const out = document.getElementById("name-out");
      if (out) out.textContent = sig.value.trim() || " ";
    }
    sig.addEventListener("input", syncName);

    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
      const next = b.dataset.lang;
      try { localStorage.setItem("oddo-lang", next); } catch (e) {}
      if (LANG_PATH[next] !== location.pathname) location.href = LANG_PATH[next] + location.search + location.hash; else setLang(next);
    }));

    // Scroll reveal.
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));

    // The budget bar on the phone fills on load.
    requestAnimationFrame(() => document.getElementById("bar").classList.add("go"));

    // Nav border once scrolled.
    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 10), { passive: true });

    // Signing up. The pass is remembered on this device, so coming back shows it again instead of an empty form.
    const PACT_KEY = "oddo.pact";
    function signed() {
      try { return JSON.parse(localStorage.getItem(PACT_KEY) || "null"); } catch (e) { return null; }
    }
    function showSigned() {
      const me = signed(), t = texts[lang];
      document.getElementById("pact").classList.toggle("signed", !!me);
      document.getElementById("after").hidden = document.getElementById("pass").hidden = !me;
      if (!me) return;
      document.getElementById("after-title").textContent = t.after_title.replace("{n}", me.name);
      document.getElementById("pass-sig").textContent = me.name;
      document.getElementById("pass-date").textContent = new Date(me.at).toLocaleDateString(lang === "en" ? "en-GB" : lang, { day: "numeric", month: "short", year: "numeric" });
      document.getElementById("share-wa").href = "https://wa.me/?text=" + encodeURIComponent(t.share_text + " " + shareLink("pact-wa"));
    }
    function shareLink(source) { return location.origin + LANG_PATH[lang] + "?s=" + source; }

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("pact-form").addEventListener("submit", e => {
      e.preventDefault();
      const form = e.target, paper = document.getElementById("paper"), button = form.querySelector("button");
      if (paper.classList.contains("signed")) return;
      document.getElementById("lang-field").value = lang;
      // Netlify Forms stores the sign-up; opened as a local file the request just fails and the page still shows the signed state.
      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(new FormData(form)).toString()
      }).catch(() => {});
      try { localStorage.setItem(PACT_KEY, JSON.stringify({ name: sig.value.trim().slice(0, 40), at: Date.now() })); } catch (err) {}
      button.firstElementChild.textContent = texts[lang].sign_busy;
      // The stamp lands, the paper thuds, confetti flies; then the paper makes way for the founder pass.
      paper.classList.add("signed");
      setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate([18, 40, 70]);
        const r = paper.querySelector(".stamp").getBoundingClientRect();
        confetti(r.left + r.width / 2, r.top + r.height / 2);
      }, reduceMotion ? 0 : 330);
      setTimeout(() => paper.classList.add("away"), reduceMotion ? 300 : 1500);
      setTimeout(() => {
        showSigned();
        const pass = document.getElementById("pass"), after = document.getElementById("after");
        pass.classList.add("in"); after.classList.add("in");
        const top = pass.getBoundingClientRect().top;
        if (top < 70 || top > innerHeight * 0.6) pass.scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => confetti(innerWidth / 2, innerHeight * 0.35, 90), reduceMotion ? 0 : 650);
        showStores();
      }, reduceMotion ? 400 : 2050);
    });

    document.getElementById("redo").addEventListener("click", () => {
      try { localStorage.removeItem(PACT_KEY); } catch (e) {}
      const paper = document.getElementById("paper"), form = document.getElementById("pact-form");
      paper.classList.remove("signed", "away");
      form.reset(); syncName();
      form.querySelector("button").firstElementChild.textContent = texts[lang].sign_cta;
      document.getElementById("pass").classList.remove("in");
      document.getElementById("after").classList.remove("in");
      showSigned(); showStores();
      document.getElementById("pact").scrollIntoView({ behavior: "smooth" });
    });

    // A short burst of paper confetti in the brand colours.
    function confetti(x, y, count = 160) {
      if (reduceMotion) return;
      const c = document.createElement("canvas"), ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
      c.id = "confetti"; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
      document.body.appendChild(c); ctx.scale(dpr, dpr);
      const colours = ["#d4ff3a", "#d4ff3a", "#f3efe6", "#ffffff", "#d6322b", "#1d3fb8"];
      const bits = Array.from({ length: count }, () => {
        const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 11;
        return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 7, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
          r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colours[Math.floor(Math.random() * colours.length)] };
      });
      const start = performance.now();
      (function frame(now) {
        const age = now - start;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.globalAlpha = Math.max(0, 1 - age / 2400);
        for (const b of bits) {
          b.vy += .32; b.vx *= .985; b.vy *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.scale(1, Math.cos(b.r * 2));
          ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
        }
        if (age < 2400) requestAnimationFrame(frame); else c.remove();
      })(start);
    }

    // Sharing: a story image (1080×1920) with the signature, a WhatsApp message and a plain link, each tagged with its source.
    async function storyImage() {
      const me = signed(), t = texts[lang];
      await Promise.all(["64px Anton", "600 64px Caveat", "800 32px Inter", "600 32px Inter"].map(f => document.fonts.load(f).catch(() => {})));
      const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
      const g = c.getContext("2d");
      g.fillStyle = "#0a0a0a"; g.fillRect(0, 0, 1080, 1920);
      const glow = g.createRadialGradient(980, 120, 0, 980, 120, 820);
      glow.addColorStop(0, "rgba(212,255,58,.32)"); glow.addColorStop(1, "rgba(212,255,58,0)");
      g.fillStyle = glow; g.fillRect(0, 0, 1080, 1920);
      g.textBaseline = "alphabetic";
      g.font = "86px Anton"; g.fillStyle = "#f5f5f4"; g.fillText("ODD", 90, 200);
      g.fillStyle = "#d4ff3a"; g.fillText("O", 90 + g.measureText("ODD").width, 200);
      const up = x => x.toLocaleUpperCase(lang);
      g.font = "800 40px Inter"; g.fillStyle = "#d4ff3a"; g.fillText(up(t.story_kicker), 90, 560);
      let y = 560;
      for (const line of t.story_title) {
        let size = 210;
        do { g.font = `${size}px Anton`; size -= 6; } while (g.measureText(up(line)).width > 900);
        y += size * 1.04; g.fillStyle = "#f5f5f4"; g.fillText(up(line), 90, y);
      }
      // The signed paper, slightly tilted.
      g.save(); g.translate(540, y + 300); g.rotate(-0.035);
      g.fillStyle = "#f3efe6"; g.beginPath(); g.roundRect(-450, -190, 900, 380, 14); g.fill();
      g.fillStyle = "rgba(0,0,0,.06)"; for (let ly = -150; ly < 190; ly += 52) g.fillRect(-450, ly, 900, 2);
      let sz = 150;
      do { g.font = `600 ${sz}px Caveat`; sz -= 6; } while (g.measureText(me.name).width > 780);
      g.fillStyle = "#1d3fb8"; g.fillText(me.name, -400, 40);
      g.fillStyle = "#1a1a1a"; g.fillRect(-400, 70, 800, 3);
      g.font = "600 30px Inter"; g.fillStyle = "#666";
      g.fillText(`Day One · ${new Date(me.at).toLocaleDateString(lang === "en" ? "en-GB" : lang)}`, -400, 130);
      g.strokeStyle = "#d6322b"; g.lineWidth = 7; g.fillStyle = "#d6322b"; g.rotate(-0.22);
      const st = up(t.stamp); let ss = 62;
      do { g.font = `${ss}px Anton`; ss -= 4; } while (g.measureText(st).width > 300);
      const sw = g.measureText(st).width;
      g.globalAlpha = .9; g.strokeRect(380 - sw, -150, sw + 50, 96); g.fillText(st, 405 - sw, -82); g.globalAlpha = 1;
      g.restore();
      // Call to action with the link.
      const by = 1500;
      g.fillStyle = "#d4ff3a"; g.beginPath(); g.roundRect(90, by, 900, 210, 34); g.fill();
      g.fillStyle = "#0a0a0a"; g.font = "800 38px Inter"; g.fillText(t.story_cta, 140, by + 82);
      g.font = "64px Anton"; g.fillText(up(location.host), 140, by + 165);
      return new Promise(res => c.toBlob(res, "image/png"));
    }
    const shareNote = msg => { document.getElementById("share-note").textContent = msg; };
    document.getElementById("share-story").addEventListener("click", async () => {
      const t = texts[lang], blob = await storyImage();
      const file = new File([blob], "oddo-day-one.png", { type: "image/png" });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: t.share_text + " " + shareLink("pact-story") });
          return;
        }
      } catch (e) { if (e.name === "AbortError") return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      shareNote(t.saved);
    });
    document.getElementById("share-link").addEventListener("click", async () => {
      const t = texts[lang], link = shareLink("pact-link");
      try {
        if (navigator.share && PLATFORM !== "web") { await navigator.share({ text: t.share_text, url: link }); return; }
        await navigator.clipboard.writeText(t.share_text + " " + link);
        shareNote(t.copied);
      } catch (e) { if (e.name !== "AbortError") shareNote(link); }
    });

    // The "One day" button refuses.
    let nopeIndex = 0;
    const later = document.getElementById("later");
    later.addEventListener("click", () => {
      later.classList.remove("shake");
      void later.offsetWidth;
      later.classList.add("shake");
      const nopes = texts[lang].nopes;
      document.getElementById("nope").textContent = nopes[nopeIndex % nopes.length];
      nopeIndex++;
    });

    // Last, so every helper above exists when the texts go in.
    setLang(initialLang());
  </script>
</body>
</html>
